<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pharma Safety</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body data-context="PACKAGING_LINE">
    <div class="glow"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <div class="logo">
            Smart Pharma
        </div>
        
        <div class="control-group">
            <label>Hardware Port</label>
            <div style="display: flex; gap: 8px; width: 100%;">
                <select id="portSelect" style="flex: 1; min-width: 0; padding: 12px;"></select>
                <button onclick="loadAvailablePorts()" style="flex-shrink: 0; padding: 12px; width: 44px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px;" title="Reload ports">🔄</button>
            </div>
            <button id="btn-connect" onclick="toggleConnection()">🔌 Connect Reader</button>
        </div>

        <div class="control-group" style="margin-top: 20px;">
            <label>Active Read Point</label>
            <select id="readPointSelect" onchange="changeReadPoint()">
                <option value="PACKAGING_LINE">📦 Packaging Line</option>
                <option value="SMART_TRUCK">🚛 Smart Truck</option>
                <option value="SMART_CABINET">🏥 Smart Cabinet</option>
                <option value="DESK">⚕️ Pharmacy Desk</option>
                <option value="WASTE_CONTAINER">🗑️ Waste Container</option>
            </select>
        </div>

        <div class="control-group" style="margin-top: 20px;">
            <label>Simulation Settings</label>
            <div style="margin-top: 8px;">
                <label style="font-size: 11px; color: var(--text-secondary);">Simulated Current Date</label>
                <input type="date" id="sim-date" style="width: 100%; margin-bottom: 8px;">
                <label style="font-size: 11px; color: var(--text-secondary);">Withdrawn Batches (comma separated)</label>
                <input type="text" id="sim-batches" placeholder="B-2026-X, B-2027-Y" style="width: 100%; margin-bottom: 12px;">
                <button onclick="applySimulationSettings()" style="width: 100%; font-size: 13px;">Apply Simulation</button>
            </div>
        </div>

        <div class="control-group" style="margin-top: 20px;">
            <label>Reading Engine</label>
            <button id="btn-monitor" onclick="toggleMonitor()">▶ Start Monitoring</button>
            <p style="font-size: 11px; color: var(--text-secondary); margin-top: 8px;">
                Automated RFID polling via WebSockets.
            </p>
        </div>

        <div class="control-group" style="margin-top: 20px;">
            <label>Simulation</label>
            <button id="btn-reset" onclick="resetSimulation()" class="danger" style="width: 100%;">🗑️ Reset Simulation</button>
            <p style="font-size: 11px; color: var(--text-secondary); margin-top: 8px;">
                Cancella tutti gli asset e gli eventi dal database. Le impostazioni (data simulata, lotti ritirati) restano.
            </p>
        </div>

        <!-- CONSOLE REMOVED FROM HERE -->
    </aside>

    <!-- MAIN CONTENT -->
    <main id="main-content">
        <header>
            <div>
                <label>Current Context</label>
                <h1 id="context-title">PACKAGING LINE</h1>
            </div>
        </header>

        <!-- Dynamic KPIs -->
        <section id="kpi-container"></section>

        <!-- Packaging Line Commissioning Form -->
        <div id="commission-form" class="glass-panel" style="display: none; padding: 24px; margin-bottom: 24px;">
            <h3 style="margin-bottom: 16px;">Automated Tag Provisioning</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                <div class="control-group">
                    <label>GTIN-14</label>
                    <input type="text" id="inp-gtin" placeholder="00800123456789" value="00800123456789">
                </div>
                <div class="control-group">
                    <label>Batch Number</label>
                    <input type="text" id="inp-batch" placeholder="B-2026-X" value="B-2026-X">
                </div>
                <div class="control-group">
                    <label>Expiry Date</label>
                    <input type="date" id="inp-expiry" value="2027-12-31">
                </div>
                <div class="control-group">
                    <label>AIC</label>
                    <input type="text" id="inp-aic" placeholder="012345678" value="012345678">
                </div>
                <div class="control-group">
                    <label>Serial Offset (Starting No.)</label>
                    <input type="number" id="inp-offset" placeholder="Leave empty to auto-increment" value="">
                </div>
            </div>
            <div style="margin-top: 24px; display: flex; gap: 12px; align-items: center;">
                <button onclick="startBatch()" id="btn-start-batch" style="flex: 1; max-width: 350px; background: #8b5cf6;">▶ Start Automated Writing</button>
                <button onclick="stopBatch()" id="btn-stop-batch" style="flex: 1; max-width: 250px; display: none;" class="danger">⏹ Stop Automated Writing</button>
                
                <div id="belt-status-indicator" style="display: none; align-items: center; gap: 8px;">
                    <div class="pulsing-dot"></div>
                    <span style="font-size: 14px; font-weight: bold; color: var(--success);">System running... Waiting for tags.</span>
                </div>
            </div>
        </div>

        <!-- Latest Scan Results (Cards) -->
        <div class="scans-section">
            <label style="margin-bottom: 16px; display: block;">Latest Scans</label>
            <section id="results-container"></section>
        </div>

        <!-- History Log Table -->
        <div class="table-container glass-panel">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>EPC</th>
                        <th>Read Point</th>
                        <th>Action</th>
                        <th>State</th>
                        <th>Alerts</th>
                    </tr>
                </thead>
                <tbody id="log-body">
                    <!-- JS fills this -->
                </tbody>
            </table>
        </div>


    </main>

    <!-- FLOATING TERMINAL -->
    <div id="floating-console" class="glass-panel">
        <div class="console-header" onclick="toggleConsole()">
            <span>Reader Logs</span>
            <svg id="console-toggle-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
        <div id="console-body" class="console-body">
            <!-- Log entries will be added here -->
        </div>
    </div>

    <script>
        function toggleConsole() {
            const consoleEl = document.getElementById('floating-console');
            consoleEl.classList.toggle('collapsed');
        }
    </script>
    <script src="/static/script.js"></script>
</body>
</html>
